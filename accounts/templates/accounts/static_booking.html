{% extends "base.html" %}
{% block content %}
<section class="container py-5" style="max-width:760px;">
  <div class="p-4 p-md-5" style="background:#111;border:1px solid #333;border-radius:14px;color:#fff;">
    <h2 class="mb-3">{{ booking_type }}</h2>
    <p class="text-secondary mb-4">
      {{ item.name }}{% if item.brand %} - {{ item.brand }}{% endif %}
      {% if item.price %} · ₹{{ item.price }}{% endif %}
    </p>
    <form method="post">
      {% csrf_token %}
      <label class="form-label">Họ tên</label>
      <input class="form-control mb-3" name="name" minlength="2" value="{{ request.POST.name|default:'' }}" required>
      <label class="form-label">Email</label>
      <input class="form-control mb-3" type="email" name="email" value="{{ request.POST.email|default:'' }}" required>
      <label class="form-label">Số điện thoại</label>
      <input class="form-control mb-3" name="phone" pattern="[0-9+\s-]{8,20}" value="{{ request.POST.phone|default:'' }}" required>
      <label class="form-label">Ngày dự kiến</label>
      <input class="form-control mb-4" type="date" name="date">
      <button class="btn btn-light" type="submit">Gửi yêu cầu</button>
      <a class="btn btn-outline-light ms-2" href="{{ back_url }}">Quay lại</a>
    </form>
  </div>
</section>
{% endblock %}
