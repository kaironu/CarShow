{% extends "base.html" %}
{% block title %}Giỏ hàng - Prestige Lane{% endblock %}
{% block content %}
<section class="container py-5" style="max-width:1000px;">
  <h2 class="text-center text-light mb-4">Giỏ hàng</h2>
  <div id="cartItems"></div>
  <div id="cartEmpty" class="text-center text-secondary py-5">
    <i class="fas fa-cart-shopping fa-3x mb-3"></i>
    <p>Giỏ hàng đang trống.</p>
    <a class="btn btn-light" href="{% url 'car_list' %}">Xem danh sách xe</a>
  </div>
  <div id="cartSummary" class="text-light text-end mt-4" style="display:none;">
    <h4>Tổng cộng: <span id="cartTotal"></span></h4>
    <button class="btn btn-light" onclick="showConsultationMessage()">Gửi yêu cầu tư vấn</button>
    <button class="btn btn-outline-light" onclick="clearCart()">Xóa giỏ hàng</button>
  </div>
</section>
<script>
  function money(value) {
    return "₹" + Number(value).toLocaleString("en-IN");
  }
  function renderCart() {
    const cart = getCart();
    const items = document.getElementById("cartItems");
    const empty = document.getElementById("cartEmpty");
    const summary = document.getElementById("cartSummary");
    items.innerHTML = "";
    empty.style.display = cart.length ? "none" : "block";
    summary.style.display = cart.length ? "block" : "none";
    let total = 0;
    cart.forEach(item => {
      total += Number(item.price) * item.quantity;
      items.insertAdjacentHTML("beforeend", `
        <div class="d-flex align-items-center gap-3 p-3 mb-3 text-light"
             style="background:#111;border:1px solid #333;border-radius:10px;">
          <img src="${item.image}" alt="${item.name}" style="width:120px;height:80px;object-fit:cover;border-radius:6px;">
          <div class="flex-grow-1">
            <h5 class="mb-1">${item.brand} ${item.name}</h5>
            <div>${money(item.price)}</div>
          </div>
          <button class="btn btn-sm btn-outline-light" onclick="changeQuantity(${item.id}, -1)">−</button>
          <span>${item.quantity}</span>
          <button class="btn btn-sm btn-outline-light" onclick="changeQuantity(${item.id}, 1)">+</button>
          <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${item.id})"><i class="fas fa-trash"></i></button>
        </div>`);
    });
    document.getElementById("cartTotal").textContent = money(total);
  }
  function changeQuantity(id, delta) {
    const cart = getCart();
    const item = cart.find(entry => entry.id === id);
    if (item) item.quantity += delta;
    saveCart(cart.filter(entry => entry.quantity > 0));
    renderCart();
  }
  function removeItem(id) {
    saveCart(getCart().filter(item => item.id !== id));
    renderCart();
  }
  function clearCart() {
    saveCart([]);
    renderCart();
  }
  function showConsultationMessage() {
    alert("Gửi yêu cầu tư vấn thành công. Nhân viên sẽ liên hệ với bạn sớm.");
  }
  document.addEventListener("DOMContentLoaded", renderCart);
</script>
{% endblock %}
