{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu - Prestige Lane</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="background:#000;color:#fff;font-family:Arial,sans-serif;">
  <main style="max-width:520px;margin:100px auto;padding:32px;background:#151515;border:1px solid #444;border-radius:14px;">
    <h2>Quên mật khẩu</h2>
    <p>Nhập email đã đăng ký để đặt mật khẩu mới.</p>
    <form id="resetForm">
      <label>Email</label>
      <input id="resetEmail" type="email" required style="width:100%;padding:12px;margin:10px 0 18px;">
      <label>Mật khẩu mới</label>
      <input id="resetPassword" type="password" minlength="3" required style="width:100%;padding:12px;margin:10px 0 18px;">
      <button type="submit" style="padding:12px 22px;">Đổi mật khẩu</button>
      <a href="{% url 'login' %}" style="color:#fff;margin-left:12px;">Quay lại đăng nhập</a>
    </form>
  </main>
  <script>
    document.getElementById("resetForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const account = JSON.parse(localStorage.getItem("prestigeLaneAccount") || "null");
      const email = document.getElementById("resetEmail").value.trim().toLowerCase();
      const password = document.getElementById("resetPassword").value;
      if (!account || Date.now() >= account.expiresAt || account.email !== email) {
        alert("Không tìm thấy tài khoản hoặc tài khoản đã hết hạn.");
        return;
      }
      account.password = password;
      account.expiresAt = Date.now() + 10 * 60 * 1000;
      localStorage.setItem("prestigeLaneAccount", JSON.stringify(account));
      alert("Đổi mật khẩu thành công. Bạn có thể đăng nhập ngay.");
      window.location.href = "{% url 'login' %}";
    });
  </script>
</body>
</html>
